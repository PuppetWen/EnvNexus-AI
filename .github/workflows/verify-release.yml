name: Verify and build Windows release

on:
  push:
    branches:
      - main
      - codex/**
  pull_request:
  workflow_dispatch:
    inputs:
      live_sources:
        description: Also query every official catalog and perform the isolated Python install test
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: windows-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      CARGO_TERM_COLOR: always
      HAS_SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git/db
            src-tauri/target
          key: windows-rust-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: windows-rust-

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Format Rust sources and retain the exact formatting patch
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifacts/ci-logs -Force | Out-Null
          cargo fmt --manifest-path src-tauri/Cargo.toml --all
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --output=artifacts/ci-logs/rustfmt.patch -- src-tauri

      - name: Check types, frontend tests, Rust format, tests, and clippy
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path artifacts/ci-logs -Force | Out-Null
          & ./scripts/Verify.ps1 *>&1 | Tee-Object -FilePath artifacts/ci-logs/verification.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Check live official sources and isolated installation
        if: github.event_name == 'workflow_dispatch' && inputs.live_sources
        shell: pwsh
        run: |
          & ./scripts/Invoke-Rust.ps1 -Task live-sources *>&1 | Tee-Object -FilePath artifacts/ci-logs/live-sources.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./scripts/Invoke-Rust.ps1 -Task live-install *>&1 | Tee-Object -FilePath artifacts/ci-logs/live-install.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build signed packages when a signing secret is already configured
        if: github.event_name != 'pull_request' && env.HAS_SIGNING_KEY == 'true'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        shell: pwsh
        run: |
          & ./scripts/Invoke-Rust.ps1 -Task tauri *>&1 | Tee-Object -FilePath artifacts/ci-logs/bundle.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./scripts/Prepare-Release.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./scripts/Invoke-Rust.ps1 -Task release-assets *>&1 | Tee-Object -FilePath artifacts/ci-logs/signature-verification.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build unsigned packages without a signing secret
        if: github.event_name == 'pull_request' || env.HAS_SIGNING_KEY != 'true'
        shell: pwsh
        run: |
          # Unsigned validation builds have no updater manifest and cannot replace signed updates.
          '{"bundle":{"createUpdaterArtifacts":false}}' | Set-Content -LiteralPath artifacts/ci-unsigned.json -Encoding utf8
          $config = (Resolve-Path artifacts/ci-unsigned.json).Path
          & ./node_modules/.bin/tauri.cmd build --ci --config $config *>&1 | Tee-Object -FilePath artifacts/ci-logs/bundle.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          New-Item -ItemType Directory -Path release -Force | Out-Null
          Copy-Item -LiteralPath src-tauri/target/release/envnexus-ai.exe -Destination "release/EnvNexus-AI_${version}_x64-portable.exe"
          Copy-Item -LiteralPath "src-tauri/target/release/bundle/nsis/EnvNexus AI_${version}_x64-setup.exe" -Destination "release/EnvNexus-AI_${version}_x64-setup.exe"
          Get-ChildItem release -Filter '*.exe' | ForEach-Object {
            $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          } | Set-Content -LiteralPath release/SHA256SUMS.txt -Encoding utf8

      - name: Check command mode and generated scripts using an isolated data directory
        shell: pwsh
        run: |
          & ./scripts/Smoke-Cli.ps1 *>&1 | Tee-Object -FilePath artifacts/ci-logs/cli-smoke.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload portable and NSIS packages
        uses: actions/upload-artifact@v4
        with:
          name: windows-packages-${{ github.sha }}
          path: |
            release/*.exe
            release/*.sig
            release/latest.json
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

      - name: Upload test and build reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-reports-${{ github.sha }}
          path: |
            artifacts/ci-logs/
            artifacts/smoke/**/summary.json
          if-no-files-found: warn
          retention-days: 14
